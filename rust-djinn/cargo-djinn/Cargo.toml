[package]
name = "cargo-djinn"
version = "0.1.0"
edition = "2021"

[lib]
name = "cargo_djinn"
path = "src/lib.rs"

[[bin]]
name = "cargo-djinn"
path = "src/main.rs"

[dependencies]
djinn-syntax = { path = "../syntax" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "printing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ctrlc = "3"
libc = "0.2"
